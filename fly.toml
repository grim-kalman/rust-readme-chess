# fly.toml app configuration file
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'rust-readme-chess'
primary_region = 'arn'

# Graceful shutdown configuration
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
dockerfile = "Dockerfile"

[deploy]
strategy = "immediate"

# The app exits non-zero when its engine dies or hangs; a restart is the recovery.
[[restart]]
policy = "always"

[env]
  # GITHUB_TOKEN must be set as a secret using: fly secrets set GITHUB_TOKEN="your_token"
  # All other env vars use defaults from Dockerfile

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
